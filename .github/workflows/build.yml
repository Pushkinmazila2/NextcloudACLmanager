name: Build Nextcloud Plugin

on:
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json' 

    - name: Install dependencies and build JS
      run: |
        cd NextcloudACLmanager # Исправлено имя папки с учетом регистра
        if [ -f "package-lock.json" ]; then
          npm ci
        else
          npm install
        fi
        npm run build

    - name: Prepare production artifact
      run: |
        mkdir dist_build
        
        # Копируем исходники из правильной папки
        cp -r NextcloudACLmanager/appinfo dist_build/
        cp -r NextcloudACLmanager/lib dist_build/
        cp -r NextcloudACLmanager/templates dist_build/
        cp -r NextcloudACLmanager/css dist_build/
        cp -r NextcloudACLmanager/img dist_build/
        
        # Стандартный сборщик Nextcloud сохраняет билд в папку js/
        if [ -d "NextcloudACLmanager/js" ]; then cp -r NextcloudACLmanager/js dist_build/; fi
        
        # Системное имя папки плагина внутри Nextcloud (должно совпадать с ID из appinfo/info.xml)
        # Обычно это ncaclmanager
        mv dist_build ncaclmanager

    - name: Archive production artifact
      run: |
        zip -r ncaclmanager-plugin.zip ncaclmanager

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ncaclmanager-plugin
        path: ncaclmanager-plugin.zip
