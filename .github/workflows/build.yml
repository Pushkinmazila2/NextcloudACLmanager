name: Build Nextcloud Plugin

on:
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # Исправлен параметр и версия Node.js
        cache: 'npm'
        cache-dependency-path: 'ncaclmanager/package-lock.json' # Явно указываем lock-файл для кэша

    - name: Install dependencies and build JS
      run: |
        cd ncaclmanager
        npm ci
        npm run build

    - name: Prepare production artifact
      run: |
        # Создаем чистую структуру для архива
        mkdir dist_build
        
        # Копируем PHP исходники и метаданные
        cp -r ncaclmanager/appinfo dist_build/
        cp -r ncaclmanager/lib dist_build/
        cp -r ncaclmanager/templates dist_build/
        cp -r ncaclmanager/css dist_build/
        cp -r ncaclmanager/img dist_build/
        
        # Nextcloud ищет скомпилированный JS в папке js/. 
        # Если Webpack собирает файлы туда, копируем её:
        if [ -d "ncaclmanager/js" ]; then cp -r ncaclmanager/js dist_build/; fi
        
        # Переименовываем папку в финальное имя плагина
        mv dist_build ncaclmanager

    - name: Archive production artifact
      run: |
        # Запаковываем в zip, чтобы плагин можно было сразу скачать и поставить
        zip -r ncaclmanager-plugin.zip ncaclmanager

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ncaclmanager-plugin
        path: ncaclmanager-plugin.zip
