name: Build Nextcloud Plugin

on:
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies and build JS
      run: |
        # Выводим текущую директорию и список файлов для диагностики
        pwd
        ls -la
        
        # В зависимости от результата ls, выберите нужный блок ниже:
        
        # ВАРИАНТ А: Если файлы (package.json) лежат прямо в корне репозитория:
        npm install
        npm run build

    - name: Prepare production artifact
      run: |
        # Создаем временную чистую папку для финального архива
        mkdir dist_build
        
        # Копируем статические ресурсы и PHP исходники
        cp -r NextcloudACLmanager/appinfo dist_build/
        cp -r NextcloudACLmanager/lib dist_build/
        cp -r NextcloudACLmanager/templates dist_build/
        cp -r NextcloudACLmanager/css dist_build/
        cp -r NextcloudACLmanager/img dist_build/
        
        # Webpack собирает скомпилированный JS (иногда и CSS) в папку js/
        # Проверяем её наличие после сборки и копируем в релиз
        if [ -d "NextcloudACLmanager/js" ]; then cp -r NextcloudACLmanager/js dist_build/; fi
        
        # Переименовываем папку сборки в системный ID плагина (обычно ncaclmanager)
        # Это важно, так как Nextcloud определяет плагин по названию его корневой папки
        mv dist_build ncaclmanager

    - name: Archive production artifact
      run: |
        zip -r ncaclmanager-plugin.zip ncaclmanager

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ncaclmanager-plugin
        path: ncaclmanager-plugin.zip
