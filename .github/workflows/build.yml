name: Build Nextcloud Plugin

on:
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies and build JS
      run: |
        # Установка зависимостей с игнорированием конфликтов версий Vue 2/3
        npm install --legacy-peer-deps
        npm run build

    - name: Prepare production artifact
      run: |
        # Создаем временную чистую папку сборки
        mkdir dist_build
        
        # Копируем файлы прямо из корня репозитория
        cp -r appinfo dist_build/
        cp -r lib dist_build/
        cp -r templates dist_build/
        cp -r css dist_build/
        cp -r img dist_build/
        
        # Проверяем папку скомпилированного JS и копируем ее, если она создалась
        if [ -d "js" ]; then cp -r js dist_build/; fi
        
        # Переименовываем во внутренний ID плагина Nextcloud
        mv dist_build ncaclmanager

    - name: Archive production artifact
      run: |
        zip -r ncaclmanager-plugin.zip ncaclmanager

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ncaclmanager-plugin
        path: ncaclmanager-plugin.zip
